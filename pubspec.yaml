name: ewn_hlm
description: "እውን ህልም — Flutter native version (migrated from PWA)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Backend (Step 1 — unchanged from the web app) ---
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4      # products (live catalog, onSnapshot equivalent)
  firebase_database: ^11.1.4   # users / cart / likes / orders / coins (Realtime DB)
  firebase_messaging: ^15.1.3  # push notifications (Step 3)

  # --- Local storage (Step 4) ---
  hive: ^2.2.3                 # cart / likes / orders / product offline cache
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2  # login session (phone+name) — persists until logout
  cached_network_image: ^3.4.1  # BUGFIX (2-5): disk-persistent image cache — product
                                 # photos were plain Image.network with no disk cache,
                                 # so every photo re-downloaded from scratch on every
                                 # app relaunch.

  # --- Native APIs (Step 3) ---
  geolocator: ^13.0.1
  image_picker: ^1.1.2         # receipt photo for checkout (Telegram upload)
  share_plus: ^10.1.2          # native share sheet for referral links

  # --- State management ---
  provider: ^6.1.2

  # --- Networking (Cloudinary upload, Cloudflare Worker calls) ---
  http: ^1.2.2
  url_launcher: ^6.3.1   # opens privacy.html (Settings menu link + registration consent)

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0

  # ---- App icon + launch/splash screen (replaces the default Flutter
  # logo that `flutter create` scaffolds — see codemagic.yaml, which now
  # runs these two generators right after `flutter pub get`). ----
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/faq_data.json
    - assets/icon/icon.png
    - assets/icons/
    - assets/illustrations/offline-illustration.png
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# ---- flutter_launcher_icons config — replaces the default Flutter-logo
# launcher icon with the courier illustration everywhere (all mipmap
# densities). Run via: `dart run flutter_launcher_icons` (already wired
# into codemagic.yaml). ----
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# ---- flutter_native_splash config — replaces the default Flutter-logo
# native splash (shown briefly before the Flutter engine/widgets even
# load) with the same image, on the app's brand green (matches
# AppTheme.brand / splashBgLight in app_theme.dart, and the in-Dart
# SplashGate background) instead of the old orange. Run via:
# `dart run flutter_native_splash:create` (already wired into
# codemagic.yaml). This is the NATIVE splash — separate from (and shown
# just before) the in-Dart `SplashGate` widget in
# lib/widgets/splash_gate.dart, which still runs afterward. ----
flutter_native_splash:
  color: "#0D5C42"
  image: assets/icon/icon.png
  android: true
  ios: false
  android_12:
    image: assets/icon/icon.png
    color: "#0D5C42"

